services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${SQL_DB_NAME:-infra_scolaires}
      POSTGRES_USER: ${SQL_USER:-infra_user}
      POSTGRES_PASSWORD: ${SQL_PASSWORD:-infra_password}
    ports:
      - "${SQL_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SQL_USER:-infra_user} -d ${SQL_DB_NAME:-infra_scolaires}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: dev
    environment:
      NODE_ENV: development
      PORT: 3000
      APP_URL: ${APP_URL:-http://localhost:3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      SQL_HOST: db
      SQL_PORT: 5432
      SQL_DB_NAME: ${SQL_DB_NAME:-infra_scolaires}
      SQL_USER: ${SQL_USER:-infra_user}
      SQL_PASSWORD: ${SQL_PASSWORD:-infra_password}
      SQL_ADMIN_USER: ${SQL_ADMIN_USER:-infra_user}
      SQL_ADMIN_PASSWORD: ${SQL_ADMIN_PASSWORD:-infra_password}
      SQL_SSL: "false"
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm run db:push && npm run dev"

volumes:
  postgres-data:
